[package]
name = "ctc"
version = "0.2.0"
edition = "2021"
description = "Causal Tracing Core - sidecar لكشف أخطاء منطق الأعمال المُعلنة صراحة في زمن التشغيل"

[[bin]]
name = "ctc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
hyper-util = "0.1"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
lru = "0.12"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
twox-hash = "1.6"
toml = "0.8"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
chrono = "0.4"
once_cell = "1"
sha2 = "0.10"

[dependencies.redis]
version = "0.25"
features = ["tokio-comp"]
optional = true

[features]
default = []
redis-cross-instance = ["redis"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
